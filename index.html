<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль дебиторской задолженности | Bitrix24</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        body { background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .pulse-warning { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }

        .gradient-border {

            background: linear-gradient(white, white) padding-box,
                        linear-gradient(135deg, #6366f1, #8b5cf6) border-box;

    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Подключаем скрипты в правильном порядке -->
<script src="//api.bitrix24.com/api/v1/"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Обёртка для вызова Bitrix24 API
    const callB24 = (method, params = {}) => {
        return new Promise((resolve, reject) => {
            console.log(`[BX24 API] Вызов метода: ${method}`, params);

            if (typeof BX24 === 'undefined' || !BX24.callMethod) {
                const error = new Error('BX24 SDK не загружен');
                console.error('[BX24 API] Критическая ошибка:', error);
                reject(error);
                return;
            }

            BX24.callMethod(method, params, (result) => {
                if (!result || typeof result.error !== 'function') {
                    reject(new Error('Некорректный ответ от BX24 API'));
                    return;
                }

                if (result.error()) {
                    const error = result.error();
                    console.error(`[BX24 API] Ошибка в методе ${method}:`, error);
                    reject(error);
                } else {
                    resolve(result.data());
                }
            });
        });
    };

    // Главный компонент
    const App = () => {
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [isDemoMode, setIsDemoMode] = useState(false);
        const dealIdRef = useRef(null);

        useEffect(() => {
            const initApp = async () => {
                console.log('[App] Инициализация приложения');

                try {
                    if (typeof BX24 !== 'undefined' && BX24.init) {
                        await new Promise((resolve, reject) => {
                            BX24.init(() => {
                                try {
                                    const placementInfo = BX24.placement.info();
                                    const options = placementInfo?.options || {};
                                    const params = new URLSearchParams(window.location.search);

                                    dealIdRef.current =
                                        options?.ID ||
                                        placementInfo?.entityId ||
                                        params.get('dealId') ||
                                        '2614';

                                    console.log('[App] ID сделки:', dealIdRef.current);
                                    resolve();
                                } catch (err) {
                                    reject(err);
                                }
                            });
                        });

                        // Загружаем данные параллельно
                        await Promise.all([
                            loadDealData(),
                            loadUserFields(),
                            loadPayments()
                        ]);
                    } else {
                        throw new Error('Bitrix24 SDK недоступен');
                    }
                } catch (err) {
                    console.error('[App] Критическая ошибка инициализации:', err);
                    setError('Не удалось загрузить приложение. Запустите его внутри Bitrix24.');
                    setIsDemoMode(true);
                    loadDemoData();
                } finally {
                    setLoading(false);
                }
            };

            initApp();
        }, []);

        // ...
    };
</script>
    
    
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // ОБНОВЛЕННАЯ ФУНКЦИЯ: Обертка для удобной работы с API Bitrix24 через промисы с подробным логированием
        const callB24 = (method, params = {}) => {
            return new Promise((resolve, reject) => {
                console.log(`[BX24 API] Вызов метода: ${method}`, params);
                
                if (!BX24 || !BX24.callMethod) {
                    const error = new Error('Библиотека Bitrix24 не загружена');
                    console.error('[BX24 API] Критическая ошибка:', error);
                    reject(error);
                    return;
                }
                
                BX24.callMethod(method, params, (result) => {
                    console.log(`[BX24 API] Ответ по методу ${method}:`, result);
                    
                    if (result.error()) {
                        // Детально логируем ошибку
                        const error = result.error();
                        console.error(`[BX24 API] Ошибка в методе ${method}:`, error);
                        console.error(`[BX24 API] Код ошибки:`, error.ex ? error.ex.error : 'N/A');
                        console.error(`[BX24 API] Описание:`, error.ex ? error.ex.error_description : 'N/A');
                        reject(error);
                    } else {
                        const data = result.data();
                        console.log(`[BX24 API] Успешные данные от ${method}:`, data);
                        resolve(data);
                    }
                });
            });
        };

        // Функция для вызова AI (Gemini через прокси)
        const callGemini = async (prompt, description) => {
            try {
                const auth = BX24.getAuth();
                if (!auth) {
                    throw new Error('Не авторизован в Bitrix24');
                }

                const apiUrl = '/api-proxy/v1beta/models/gemini-2.0-flash-exp:generateContent';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-B24-Access-Token': auth.access_token,
                        'X-B24-Refresh-Token': auth.refresh_token || '',
                        'X-B24-Domain': auth.domain,
                        'X-Expense-Description': encodeURIComponent(description)
                    },
                    body: JSON.stringify({
                        contents: [{
                            role: 'user',
                            parts: [{ text: prompt }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            topP: 1,
                            topK: 40,
                            maxOutputTokens: 1000
                        }
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Ошибка API (${response.status}): ${errorText}`);
                }

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            } catch (error) {
                console.error('Ошибка при вызове Gemini API:', error);
                throw error;
            }
        };

        // Компонент для отображения платежа
        const PaymentCard = ({ payment, onStatusChange, onDelete, onAddToDeal }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [editedPayment, setEditedPayment] = useState({ ...payment });
            const statusColors = {
                'ожидает': 'bg-yellow-100 text-yellow-800 border-yellow-200',
                'оплачен': 'bg-green-100 text-green-800 border-green-200',
                'просрочен': 'bg-red-100 text-red-800 border-red-200',
                'частично': 'bg-blue-100 text-blue-800 border-blue-200'
            };

            const formatDate = (dateString) => {
                if (!dateString) return '—';
                try {
                    const date = new Date(dateString);
                    return date.toLocaleDateString('ru-RU');
                } catch (e) {
                    return dateString;
                }
            };

            const handleSave = () => {
                onStatusChange(payment.id, editedPayment);
                setIsEditing(false);
            };

            const getDaysOverdue = () => {
                if (payment.status !== 'просрочен' || !payment.due_date) return 0;
                try {
                    const dueDate = new Date(payment.due_date);
                    const today = new Date();
                    const diffTime = today - dueDate;
                    return Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
                } catch (e) {
                    return 0;
                }
            };

            const daysOverdue = getDaysOverdue();

            return (
                <div className={`bg-white rounded-xl border ${payment.status === 'просрочен' ? 'border-red-300' : 'border-slate-200'} p-4 hover:shadow-sm transition-shadow`}>
                    <div className="flex justify-between items-start mb-3">
                        <div className="flex-1">
                            <div className="flex items-center gap-2 mb-1">
                                <span className="material-symbols-outlined text-slate-400 text-lg">
                                    {payment.type === 'аванс' ? 'payments' : 'receipt_long'}
                                </span>
                                <h4 className="font-semibold text-slate-800">{payment.name}</h4>
                                {payment.in_deal && (
                                    <span className="px-2 py-0.5 bg-indigo-100 text-indigo-700 text-xs rounded-full">
                                        В сделке
                                    </span>
                                )}
                            </div>
                            <p className="text-sm text-slate-500">
                                Срок: {formatDate(payment.due_date)}
                                {payment.actual_date && ` • Факт: ${formatDate(payment.actual_date)}`}
                                {daysOverdue > 0 && (
                                    <span className="ml-2 text-red-600 font-medium">
                                        Просрочено на {daysOverdue} дн.
                                    </span>
                                )}
                            </p>
                        </div>
                        <div className="flex gap-2">
                            {!payment.in_deal && onAddToDeal && (
                                <button
                                    onClick={() => onAddToDeal(payment)}
                                    className="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg"
                                    title="Добавить в сделку"
                                >
                                    <span className="material-symbols-outlined text-lg">add_circle</span>
                                </button>
                            )}
                            <button
                                onClick={() => setIsEditing(!isEditing)}
                                className="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-lg"
                            >
                                <span className="material-symbols-outlined text-lg">edit</span>
                            </button>
                            <button
                                onClick={() => onDelete(payment.id)}
                                className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg"
                            >
                                <span className="material-symbols-outlined text-lg">delete</span>
                            </button>
                        </div>
                    </div>

                    <div className="flex justify-between items-center">
                        <div>
                            <p className="text-2xl font-bold text-slate-900">
                                {parseFloat(payment.amount || 0).toLocaleString('ru-RU')} ₽
                            </p>
                            {payment.paid_amount > 0 && (
                                <p className="text-sm text-slate-500">
                                    Оплачено: {parseFloat(payment.paid_amount || 0).toLocaleString('ru-RU')} ₽
                                    {payment.amount > 0 && (
                                        <span className="ml-2">
                                            ({Math.round(((payment.paid_amount || 0) / payment.amount) * 100)}%)
                                        </span>
                                    )}
                                </p>
                            )}
                        </div>
                        {isEditing ? (
                            <div className="flex gap-2">
                                <select
                                    value={editedPayment.status}
                                    onChange={(e) => setEditedPayment({...editedPayment, status: e.target.value})}
                                    className="px-3 py-1.5 border border-slate-300 rounded-lg text-sm"
                                >
                                    <option value="ожидает">Ожидает</option>
                                    <option value="оплачен">Оплачен</option>
                                    <option value="просрочен">Просрочен</option>
                                    <option value="частично">Частично</option>
                                </select>
                                <button
                                    onClick={handleSave}
                                    className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm"
                                >
                                    Сохранить
                                </button>
                            </div>
                        ) : (
                            <span className={`px-3 py-1 rounded-full text-sm font-medium border ${statusColors[payment.status] || statusColors.ожидает}`}>
                                {payment.status}
                            </span>
                        )}
                    </div>

                    {payment.comment && (
                        <p className="mt-3 text-sm text-slate-600 bg-slate-50 p-2 rounded-lg">
                            {payment.comment}
                        </p>
                    )}
                </div>
            );
        };

        // Компонент для добавления нового платежа
        const AddPaymentForm = ({ dealId, onAddPayment, loading }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [formData, setFormData] = useState({
                name: '',
                amount: '',
                due_date: new Date().toISOString().split('T')[0],
                type: 'плановый',
                comment: ''
            });

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                try {
                    const newPayment = {
                        deal_id: dealId,
                        ...formData,
                        amount: parseFloat(formData.amount) || 0,
                        paid_amount: 0,
                        status: 'ожидает',
                        created_at: new Date().toISOString()
                    };
                    
                    await onAddPayment(newPayment);
                    setIsOpen(false);
                    setFormData({
                        name: '',
                        amount: '',
                        due_date: new Date().toISOString().split('T')[0],
                        type: 'плановый',
                        comment: ''
                    });
                } catch (error) {
                    console.error('Ошибка при добавлении платежа:', error);
                }
            };

            return (
                <>
                    <button
                        onClick={() => setIsOpen(true)}
                        disabled={loading}
                        className="flex items-center gap-2 px-4 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl hover:shadow-lg transition-all hover:scale-[1.02] disabled:opacity-50"
                    >
                        <span className="material-symbols-outlined">add</span>
                        <span>Добавить платеж</span>
                    </button>

                    {isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md">
                                <div className="flex justify-between items-center p-6 border-b border-slate-200">
                                    <h3 className="text-xl font-bold text-slate-900">Новый платеж</h3>
                                    <button
                                        onClick={() => setIsOpen(false)}
                                        className="p-2 hover:bg-slate-100 rounded-lg"
                                    >
                                        <span className="material-symbols-outlined">close</span>
                                    </button>
                                </div>
                                
                                <form onSubmit={handleSubmit} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                            Наименование платежа
                                        </label>
                                        <input
                                            type="text"
                                            required
                                            value={formData.name}
                                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            className="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                            placeholder="Например: Аванс 30%"
                                        />
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">
                                                Сумма (₽)
                                            </label>
                                            <input
                                                type="number"
                                                required
                                                min="0"
                                                step="0.01"
                                                value={formData.amount}
                                                onChange={(e) => setFormData({...formData, amount: e.target.value})}
                                                className="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                placeholder="0.00"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">
                                                Срок оплаты
                                            </label>
                                            <input
                                                type="date"
                                                required
                                                value={formData.due_date}
                                                onChange={(e) => setFormData({...formData, due_date: e.target.value})}
                                                className="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                            />
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                            Тип платежа
                                        </label>
                                        <select
                                            value={formData.type}
                                            onChange={(e) => setFormData({...formData, type: e.target.value})}
                                            className="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        >
                                            <option value="плановый">Плановый платеж</option>
                                            <option value="аванс">Аванс</option>
                                            <option value="финальный">Финальный расчет</option>
                                            <option value="штраф">Штраф/Пеня</option>
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                            Комментарий
                                        </label>
                                        <textarea
                                            value={formData.comment}
                                            onChange={(e) => setFormData({...formData, comment: e.target.value})}
                                            className="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                            rows="2"
                                            placeholder="Дополнительная информация..."
                                        />
                                    </div>
                                    
                                    <div className="flex gap-3 pt-4">
                                        <button
                                            type="button"
                                            onClick={() => setIsOpen(false)}
                                            className="flex-1 px-4 py-3 border border-slate-300 text-slate-700 rounded-xl hover:bg-slate-50"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 px-4 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl hover:shadow-lg"
                                        >
                                            Добавить платеж
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        // Главный компонент приложения
        const App = () => {
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [error, setError] = useState(null);
            const [dealData, setDealData] = useState(null);
            const [payments, setPayments] = useState([]);
            const [aiAnalysis, setAiAnalysis] = useState(null);
            const [analyzing, setAnalyzing] = useState(false);
            const [activeTab, setActiveTab] = useState('payments');
            const [userFields, setUserFields] = useState([]);
            const [isDemoMode, setIsDemoMode] = useState(false);
            const dealIdRef = useRef(null);
            const smartProcessIdRef = useRef(135);

            // Загрузка данных сделки и платежей
            useEffect(() => {
                const initApp = async () => {
                    console.log('[App] Начало инициализации приложения');
                    
                    try {
                        if (!BX24) {
                            throw new Error('Библиотека Bitrix24 не загружена');
                        }

                        await new Promise((resolve, reject) => {
                            BX24.init(() => {
                                console.log('[App] Bitrix24 SDK инициализирован');
                                
                                try {
                                    // Получаем ID сделки из контекста размещения
                                    const placementInfo = BX24.placement.info();
                                    console.log('[App] Информация о размещении:', placementInfo);
                                    
                                    const options = placementInfo.options || {};
                                    dealIdRef.current = options.ID || placementInfo.entityId;
                                    
                                    if (!dealIdRef.current) {
                                        console.warn('[App] ID сделки не найден в контексте размещения');
                                        // Для тестирования, если нет ID в размещении
                                        const params = new URLSearchParams(window.location.search);
                                        dealIdRef.current = params.get('dealId') || '2614';
                                        console.log('[App] Используем ID сделки для теста:', dealIdRef.current);
                                    } else {
                                        console.log('[App] ID сделки из контекста:', dealIdRef.current);
                                    }

                                    resolve();
                                } catch (err) {
                                    console.error('[App] Ошибка получения контекста размещения:', err);
                                    reject(err);
                                }
                            });
                        });

                        // Загружаем данные сделки
                        await loadDealData();
                        // Загружаем пользовательские поля
                        await loadUserFields();
                        // Загружаем платежи
                        await loadPayments();
                    } catch (err) {
                        console.error('[App] Критическая ошибка инициализации:', err);
                        setError('Не удалось загрузить приложение. Проверьте, что вы находитесь в Bitrix24.');
                        // Включаем демо-режим при критической ошибке
                        setIsDemoMode(true);
                        loadDemoData();
                    } finally {
                        setLoading(false);
                    }
                };

                initApp();
            }, []);

            // ОБНОВЛЕННАЯ ФУНКЦИЯ: Загрузка данных сделки
            const loadDealData = async () => {
                console.log('[App] Начало загрузки данных сделки для ID:', dealIdRef.current);
                
                try {
                    const deal = await callB24('crm.deal.get', { 
                        id: dealIdRef.current,
                        select: ['ID', 'TITLE', 'OPPORTUNITY', 'COMPANY_ID', 'CONTACT_ID', 'STAGE_ID', 'ASSIGNED_BY_ID', 'CLOSEDATE']
                    });
                    
                    console.log('[App] Данные сделки успешно получены:', deal);
                    
                    // Загружаем информацию о компании
                    if (deal && deal.COMPANY_ID) {
                        try {
                            const company = await callB24('crm.company.get', { id: deal.COMPANY_ID });
                            deal.COMPANY_TITLE = company.TITLE;
                            console.log('[App] Данные компании загружены:', company.TITLE);
                        } catch (e) {
                            console.warn('[App] Не удалось загрузить компанию:', e);
                            deal.COMPANY_TITLE = 'Компания не загружена';
                        }
                    } else {
                        deal.COMPANY_TITLE = 'Компания не указана';
                    }
                    
                    // Загружаем информацию о контакте
                    if (deal && deal.CONTACT_ID) {
                        try {
                            const contact = await callB24('crm.contact.get', { id: deal.CONTACT_ID });
                            deal.CONTACT_NAME = `${contact.NAME || ''} ${contact.LAST_NAME || ''}`.trim();
                            console.log('[App] Данные контакта загружены:', deal.CONTACT_NAME);
                        } catch (e) {
                            console.warn('[App] Не удалось загрузить контакт:', e);
                            deal.CONTACT_NAME = 'Контакт не загружен';
                        }
                    } else {
                        deal.CONTACT_NAME = 'Контакт не указан';
                    }
                    
                    setDealData(deal);
                    setIsDemoMode(false); // Отключаем демо-режим при успешной загрузке
                    
                } catch (err) {
                    console.error('[App] КРИТИЧЕСКАЯ ОШИБКА при загрузке сделки:', err);
                    // Включаем демо-режим только при ошибке загрузки
                    setIsDemoMode(true);
                    setDealData({
                        ID: dealIdRef.current,

                        pendingCount: 0

                                                            <span>Запланируйте напоминания о предстоящих платежах</span>
                                                        </li>
                                                    )}
                                                    <li className="flex items-start gap-2">
                                                        <span className="material-symbols-outlined text-green-500 text-sm">check_circle</span>
                                                        <span>Регулярно обновляйте статусы оплат</span>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                        
                                        {aiAnalysis && (
                                            <div className="p-4 bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl border border-blue-200">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className="material-symbols-outlined text-blue-600">auto_awesome</span>
                                                    <h4 className="font-semibold text-slate-800">AI Анализ рисков и рекомендации</h4>
                                                </div>
                                                <div className="text-slate-700 whitespace-pre-wrap">
                                                    {aiAnalysis}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Боковая панель */}
                        <div className="space-y-6">
                            <div className="bg-white rounded-2xl border border-slate-200 p-6">
                                <h3 className="font-bold text-slate-900 mb-4">Информация о сделке</h3>
                                <div className="space-y-3">
                                    <div>
                                        <p className="text-sm text-slate-500">ID сделки</p>
                                        <p className="font-medium">{dealIdRef.current}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-slate-500">Название сделки</p>
                                        <p className="font-medium truncate">{dealData?.TITLE || '—'}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-slate-500">Компания</p>
                                        <p className="font-medium">{dealData?.COMPANY_TITLE || '—'}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-slate-500">Контактное лицо</p>
                                        <p className="font-medium">{dealData?.CONTACT_NAME || '—'}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-slate-500">Сумма сделки</p>
                                        <p className="text-xl font-bold text-indigo-600">
                                            {(dealData?.OPPORTUNITY || 0).toLocaleString('ru-RU')} ₽
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl border border-slate-200 p-6">
                                <h3 className="font-bold text-slate-900 mb-4">Диагностика</h3>
                                <div className="space-y-3">
                                    <div className="p-3 bg-slate-50 rounded-lg">
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className={`material-symbols-outlined ${isDemoMode ? 'text-yellow-600' : 'text-green-600'}`}>
                                                {isDemoMode ? 'warning' : 'check_circle'}
                                            </span>
                                            <span className="font-medium">Режим работы</span>
                                        </div>
                                        <p className="text-sm text-slate-600">
                                            {isDemoMode ? 'Демо-режим (ошибка загрузки)' : 'Режим Bitrix24 (данные загружены)'}
                                        </p>
                                    </div>
                                    
                                    <button 
                                        onClick={() => {
                                            console.clear();
                                            console.log('[App] Ручная проверка работы API...');
                                            callB24('crm.deal.get', { id: dealIdRef.current })
                                                .then(data => {
                                                    console.log('[App] Ручная проверка успешна:', data);
                                                    alert('Проверка API успешна! Данные в консоли.');
                                                })
                                                .catch(err => {
                                                    console.error('[App] Ручная проверка не удалась:', err);
                                                    alert('Ошибка проверки API. Смотрите консоль.');
                                                });
                                        }}
                                        className="w-full flex items-center justify-between p-3 text-left hover:bg-slate-50 rounded-lg group border border-slate-300"
                                    >
                                        <div className="flex items-center gap-3">
                                            <span className="material-symbols-outlined text-slate-400 group-hover:text-indigo-600">
                                                bug_report
                                            </span>
                                            <span>Проверить API</span>
                                        </div>
                                        <span className="material-symbols-outlined text-slate-400 text-lg">
                                            chevron_right
                                        </span>
                                    </button>
                                    
                                    <button 
                                        onClick={() => {
                                            const lines = [
                                                '=== Диагностика приложения ===',
                                                `Время: ${new Date().toLocaleString()}`,
                                                `ID сделки: ${dealIdRef.current}`,
                                                `Режим: ${isDemoMode ? 'Демо' : 'Bitrix24'}`,
                                                `Платежей: ${payments.length}`,
                                                `Ошибка: ${error || 'Нет'}`,
                                                'Откройте консоль (F12) для подробной информации.'
                                            ];
                                            alert(lines.join('\n'));
                                        }}
                                        className="w-full flex items-center justify-between p-3 text-left hover:bg-slate-50 rounded-lg group border border-slate-300"
                                    >
                                        <div className="flex items-center gap-3">
                                            <span className="material-symbols-outlined text-slate-400 group-hover:text-indigo-600">
                                                info
                                            </span>
                                            <span>Показать диагностику</span>
                                        </div>
                                        <span className="material-symbols-outlined text-slate-400 text-lg">
                                            chevron_right
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Футер */}
                    <div className="mt-8 pt-6 border-t border-slate-200 text-center text-sm text-slate-500">
                        <p>
                            Обновлено: {new Date().toLocaleDateString('ru-RU')} • 
                            ID сделки: {dealIdRef.current} • 
                            Режим: {isDemoMode ? 'Демо (ошибка загрузки)' : 'Bitrix24'} •
                            {payments.length} платеж{payments.length % 10 === 1 ? '' : 'а'}
                        </p>
                        <p className="mt-1 text-xs">
                            {isDemoMode ? 'Включён демо-режим. Откройте консоль (F12) для диагностики проблемы с API.' : 'Приложение работает с данными Bitrix24.'}
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
